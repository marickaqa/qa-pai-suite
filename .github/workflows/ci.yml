name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

   ui-tests:
    name: SaaS UI tests (live dev)
    needs: typecheck
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: live-ui-tests
      cancel-in-progress: true
    env:
      SAAS_URL: ${{ secrets.SAAS_URL }}
      SAAS_EMAIL: ${{ secrets.SAAS_EMAIL }}
      SAAS_PASSWORD: ${{ secrets.SAAS_PASSWORD }}
      SAAS_LOGOUT_EMAIL: ${{ secrets.SAAS_LOGOUT_EMAIL }}
      SAAS_LOGOUT_PASSWORD: ${{ secrets.SAAS_LOGOUT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Get Playwright version
        id: pw
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browser (chromium)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run SaaS UI tests
        # global per-test timeout so a hung hydration fails fast (60s) instead of
        # burning the whole budget; --max-failures stops a cascade early.
        run: npx playwright test --timeout=60000 --max-failures=8